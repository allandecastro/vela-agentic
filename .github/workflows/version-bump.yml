name: Version bump

# Every merge to main bumps the plugin's patch version, so `claude plugin update` sees a new release
# (an unchanged version keeps the cached copy), and the `# version:` line of every hook script that changed. The push uses GITHUB_TOKEN, which triggers no workflow: no loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: version-bump

jobs:
  bump:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}   # see ci.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, so a queued run includes the previous bump
          fetch-depth: 0   # the hook bump diffs against the push's previous tip

      - name: Bump patch in plugin.json and marketplace.json
        run: |
          node -e '
            const fs = require("fs");
            const p = ".claude-plugin/plugin.json", m = ".claude-plugin/marketplace.json";
            const plugin = JSON.parse(fs.readFileSync(p)), market = JSON.parse(fs.readFileSync(m));
            const [a, b, c] = plugin.version.split(".").map(Number);
            plugin.version = market.metadata.version = `${a}.${b}.${c + 1}`;
            fs.writeFileSync(p, JSON.stringify(plugin, null, 2) + "\n");
            fs.writeFileSync(m, JSON.stringify(market, null, 2) + "\n");
            console.log(plugin.version);
          '

      - name: Bump the version of the changed hook scripts
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || { echo "no previous tip: hooks left as they are"; exit 0; }
          for f in $(git diff --name-only "$BEFORE" HEAD -- hooks/bin/ | grep '\.sh$'); do
            [ -f "$f" ] || continue
            node -e '
              const fs = require("fs"), f = process.argv[1], sh = fs.readFileSync(f, "utf8");
              const out = sh.replace(/^(# version: )(\d+)\.(\d+)\.(\d+)$/m, (_, k, a, b, c) => `${k}${a}.${b}.${+c + 1}`);
              if (out === sh) { console.error(`${f}: no version line`); process.exit(1); }
              fs.writeFileSync(f, out);
            ' "$f"
            echo "$f: $(grep -m1 '^# version:' "$f")"
          done
          node scripts/sync-copilot.mjs   # re-embed the bumped scripts in the Copilot hook configs

      - name: Commit
        run: |
          v=$(node -p 'require("./.claude-plugin/plugin.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hooks hooks.json .github && git commit -am "chore(release): vela plugin $v"
          git push
