name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    name: Lint pack & check generated surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Local check (same script as the pre-push hook)
        run: sh scripts/check.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: spec-check fixture tests
        run: bash tools/spec-check.test.sh
