name: CI

# Runner: GitHub-hosted only. The repository is public: never attach a self-hosted runner (a fork's pull request
# could run code on it).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    name: Lint pack & check generated surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Local check (same script as the pre-push hook)
        run: sh scripts/check.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: spec-check fixture tests
        run: bash tools/spec-check.test.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          v=8.30.1; arch=$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_${arch}.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the full history
        run: gitleaks git --no-banner --redact --report-format sarif --report-path gitleaks.sarif .

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
